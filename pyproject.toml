[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lathe-landscape"
version = "0.3.0"
description = "Loss-landscape fingerprints for trained classifiers (LATHE)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "tqdm>=4.65"]

[project.scripts]
lfp = "lfp.cli:main"

[tool.setuptools]
packages = ["lfp", "lfp.probes"]

[tool.setuptools.package-data]
lfp = ["site/*.html", "site/*.js", "site/*.css", "site/img/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
